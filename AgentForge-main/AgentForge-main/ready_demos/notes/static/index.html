<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #note-form { margin-bottom: 30px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        input, textarea, button { display: block; margin-bottom: 10px; padding: 8px; width: 100%; box-sizing: border-box; }
        #notes-list { list-style: none; padding: 0; }
        .note-item { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 5px; background-color: #f9f9f9; }
        .note-item h3 { margin-top: 0; }
        .tags span { display: inline-block; background: #007bff; color: white; padding: 3px 8px; border-radius: 3px; font-size: 0.8em; margin-right: 5px; }
        .delete-btn { background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; float: right; }
        .search-bar { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>My Notes</h1>

    <div class="search-bar">
        <input type="text" id="search-query" placeholder="Search by title or content...">
        <input type="text" id="search-tag" placeholder="Filter by tag (comma-separated)">
        <button onclick="searchNotes()">Search</button>
        <button onclick="loadNotes()">Show All</button>
    </div>

    <div id="note-form">
        <h2>Create New Note</h2>
        <input type="text" id="note-title" placeholder="Title" required>
        <textarea id="note-content" placeholder="Content" rows="5" required></textarea>
        <input type="text" id="note-tags" placeholder="Tags (e.g., work, personal)" required>
        <button onclick="createNote()">Save Note</button>
    </div>

    <h2>Notes</h2>
    <ul id="notes-list">
        <!-- Notes will be injected here -->
    </ul>

    <script>
        const API_BASE = ''; // Assumes API runs on the same host/port

        async function fetchNotes(query = '', tag = '') {
            const url = new URL('/notes/search', window.location.origin);
            if (query) url.searchParams.append('q', query);
            if (tag) url.searchParams.append('tag', tag);
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch notes.');
                return await response.json();
            } catch (error) {
                console.error("Error loading notes:", error);
                document.getElementById('notes-list').innerHTML = '<li style="color: red;">Error loading notes. Please try again.</li>';
                return [];
            }
        }

        async function loadNotes() {
            const notes = await fetchNotes();
            renderNotes(notes);
        }

        async function searchNotes() {
            const query = document.getElementById('search-query').value;
            const tag = document.getElementById('search-tag').value.split(',').map(t => t.trim()).join(',');
            const notes = await fetchNotes(query, tag);
            renderNotes(notes);
        }

        async function createNote() {
            const title = document.getElementById('note-title').value;
            const content = document.getElementById('note-content').value;
            const tagsInput = document.getElementById('note-tags').value;
            
            const tags = tagsInput.split(',').map(t => t.trim()).filter(t => t.length > 0);

            try {
                const response = await fetch('/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content, tags })
                });

                if (response.status === 201) {
                    const newNote = await response.json();
                    console.log("Note created successfully:", newNote);
                    // Clear form and reload all notes
                    document.getElementById('note-title').value = '';
                    document.getElementById('note-content').value = '';
                    document.getElementById('note-tags').value = '';
                    loadNotes();
                } else {
                    const error = await response.json();
                    alert(`Failed to create note: ${error.detail || response.statusText}`);
                }
            } catch (error) {
                console.error("Error creating note:", error);
                alert("Network error while creating note.");
            }
        }

        async function deleteNote(id) {
            if (!confirm("Are you sure you want to delete this note?")) return;

            try {
                const response = await fetch(`/notes/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.status === 200) {
                    alert("Note deleted successfully.");
                    loadNotes(); // Refresh list
                } else if (response.status === 404) {
                    alert("Note not found.");
                } else {
                    const error = await response.json();
                    alert(`Error deleting note: ${error.detail || 'Unknown error'}`);
                }
            } catch (error) {
                console.error("Error deleting note:", error);
                alert("Network error while deleting note.");
            }
        }

        function renderNotes(notes) {
            const list = document.getElementById('notes-list');
            list.innerHTML = '';

            if (notes.length === 0) {
                list.innerHTML = '<li style="text-align: center; color: #888;">No notes found. Try creating one or adjusting your search.</li>';
                return;
            }

            notes.forEach(note => {
                const li = document.createElement('li');
                li.className = 'note-item';
                
                const tagsHtml = note.tags.map(tag => `<span>${tag}</span>`).join('');

                li.innerHTML = `
                    <h3>${note.title}</h3>
                    <p>${note.content.replace(/\n/g, '<br>')}</p>
                    <div class="tags">
                        ${tagsHtml}
                    </div>
                    <button class="delete-btn" onclick="deleteNote('${note.id}')">Delete</button>
                `;
                list.appendChild(li);
            });
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', loadNotes);
    </script>
</body>
</html>
